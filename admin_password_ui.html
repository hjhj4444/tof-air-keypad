<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 비밀번호 변경 UI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p {
      margin: 0 0 20px;
      color: #666;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }
    .status.success {
      display: block;
      background: #e9f8ee;
      color: #1f7a3f;
    }
    .status.error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>관리자 비밀번호 변경</h1>


    <label for="currentPassword">기존 비밀번호</label>
    <input
      id="currentPassword"
      type="password"
      placeholder="기존 비밀번호 4자리를 입력해주세요."
      maxlength="20"
    />


    <label for="newPassword">새 비밀번호</label>
    <input
      id="newPassword"
      type="password"
      placeholder="새로운 비밀번호 4자리를 입력해주세요."
      maxlength="20"
    />


    <button id="saveBtn">비밀번호 변경</button>


    <div id="status" class="status"></div>
  </div>


  <script>
    const API_URL = "https://vywibxwwge.execute-api.ap-northeast-2.amazonaws.com/prod/password";


    const currentPasswordInput = document.getElementById("currentPassword");
    const newPasswordInput = document.getElementById("newPassword");
    const saveBtn = document.getElementById("saveBtn");
    const statusBox = document.getElementById("status");


    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = `status ${type}`;
    }


    saveBtn.addEventListener("click", async () => {
      const device_id = "main";
      const current_password = currentPasswordInput.value.trim();
      const new_password = newPasswordInput.value.trim();


      if (!current_password || !new_password) {
        showStatus("기존 비밀번호와 새 비밀번호를 모두 입력해 주세요.", "error");
        return;
      }


      saveBtn.disabled = true;
      showStatus("비밀번호 변경 요청을 보내는 중입니다...", "success");


      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            device_id,
            current_password,
            new_password
          })
        });


        const text = await response.text();
        let result = {};


        try {
          result = JSON.parse(text);
        } catch (e) {
          result = { message: text };
        }


        if (!response.ok) {
          throw new Error(result.message || `요청 실패 (${response.status})`);
        }


        showStatus("비밀번호가 성공적으로 변경되었습니다.", "success");
        currentPasswordInput.value = "";
        newPasswordInput.value = "";
    } catch (error) {
  if (error.message.includes("Current password is incorrect")) {
    showStatus("현재 비밀번호가 올바르지 않습니다.", "error");
  } else {
    showStatus("오류가 발생했습니다.", "error");
  }
} finally {
  saveBtn.disabled = false;
}
    });
  </script>
</body>
</html>
